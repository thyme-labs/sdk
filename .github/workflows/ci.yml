name: CI

# `pull_request` fires for any base, so PRs into dev are covered here. Direct
# pushes to dev are gated by the Release workflow, which runs the same checks
# before it publishes a snapshot — adding dev here would just duplicate them.
on:
  pull_request:
  push:
    branches:
      - master

# A newer push to the same ref makes the in-flight run redundant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Pin the version: without it every job resolves and downloads Bun fresh,
      # which never populates the action's cache and puts a network fetch from
      # GitHub's CDN in front of every run. That fetch is what failed the Test
      # job on #22 (`TypeError: fetch failed`) while Lint and Build passed.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Biome
        run: bun run lint

      # `test` needs the build anyway, so this is the same work the old
      # three-job matrix did — minus two redundant installs and builds.
      - name: Build packages
        run: bun run build

      - name: Run tests
        run: bun run test
