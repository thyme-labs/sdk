name: Release

on:
  push:
    branches:
      - master
      - dev

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        # v7 does not inject the dummy NODE_AUTH_TOKEN that can make registry
        # reads look unauthenticated during an OIDC trusted-publishing run.
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      # Trusted Publishing (OIDC) needs npm >= 11.5.1; Node's bundled npm varies.
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@11.17.0

      # Pinned for the same reason as ci.yml: an unpinned setup-bun re-downloads
      # Bun on every run and can fail the job outright on a CDN hiccup. Here that
      # would abort a publish.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # dev is pushed to directly, so this workflow is the only gate on those
      # commits. Lint here too, or nothing checks it before a snapshot ships.
      - name: Run Biome
        run: bun run lint

      - name: Build packages
        run: bun run build

      - name: Run tests
        run: bun run test

      - name: Create dev snapshot changeset
        if: github.ref == 'refs/heads/dev'
        run: |
          cat > .changeset/dev-snapshot.md <<'EOF'
          ---
          '@thyme-labs/sdk': patch
          '@thyme-labs/cli': patch
          ---

          Publish a development snapshot from the dev branch.
          EOF

      - name: Version dev snapshot
        if: github.ref == 'refs/heads/dev'
        run: bunx @changesets/cli version --snapshot dev

      - name: Build versioned dev packages
        if: github.ref == 'refs/heads/dev'
        run: bun run build

      - name: Publish dev snapshot
        if: github.ref == 'refs/heads/dev'
        run: bunx @changesets/cli publish --tag dev --provenance

      - name: Create Stable Release Pull Request or Publish
        if: github.ref == 'refs/heads/master'
        id: changesets
        uses: changesets/action@v1
        with:
          publish: bun run release
          commit: "chore: release packages"
          title: "chore: release packages"
        env:
          GITHUB_TOKEN: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}
